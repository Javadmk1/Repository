name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autosubtitle-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download licensed Vazirmatn Persian font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Regular.ttf" -o app/src/main/assets/fonts/Vazirmatn-Regular.ttf
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/OFL.txt" -o app/src/main/assets/fonts/OFL.txt
          test -s app/src/main/assets/fonts/Vazirmatn-Regular.ttf
          test -s app/src/main/assets/fonts/OFL.txt

      - name: Bundle offline Whisper base model into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 "$MODEL_URL" -o app/src/main/assets/models/ggml-base.bin
          MODEL_BYTES="$(wc -c < app/src/main/assets/models/ggml-base.bin)"
          echo "Bundled Whisper model size: $MODEL_BYTES bytes"
          test "$MODEL_BYTES" -gt 100000000

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run Android lint checks
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubtitle-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
